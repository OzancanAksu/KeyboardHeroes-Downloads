name: Android Production APK — Persistent Signing Key
on:
  # Production signing is deliberately manual. Do not auto-fail every beta
  # build when owner-managed permanent signing credentials are not configured.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  production-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify owner-supplied long-lived signing secrets
        env:
          KH_KEYSTORE_B64: ${{ secrets.KH_ANDROID_RELEASE_KEYSTORE_B64 }}
          KH_KEYSTORE_PASSWORD: ${{ secrets.KH_ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KH_KEYSTORE_B64" ] || [ -z "$KH_KEYSTORE_PASSWORD" ]; then
            echo "::error::A persistent signing key and password must be provisioned as repository Actions secrets. No release will be published."
            exit 1
          fi
          file="$RUNNER_TEMP/keyboardheroes-release.p12"
          umask 077
          printf '%s' "$KH_KEYSTORE_B64" | base64 --decode > "$file"
          chmod 600 "$file"
          keytool -list -keystore "$file" -storetype PKCS12 -storepass "$KH_KEYSTORE_PASSWORD" -alias keyboardheroes >/dev/null
          echo "KH_ANDROID_KEYSTORE_PATH=$file" >> "$GITHUB_ENV"
          echo "KH_ANDROID_VERSION_NAME=0.6.7" >> "$GITHUB_ENV"
          echo "KH_ANDROID_VERSION_CODE=14" >> "$GITHUB_ENV"
      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the release APK with the persistent private signing key
        env:
          KH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KH_ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --project-dir android :app:assembleRelease
      - name: Verify cryptographic APK signature and publish digest
        shell: bash
        run: |
          set -euo pipefail
          source="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$source"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$source"
          mkdir -p android-output
          cp "$source" android-output/KeyboardHeroes-Android-v0.6.7.apk
          (
            cd android-output
            sha256sum KeyboardHeroes-Android-v0.6.7.apk > SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardHeroes-Android-v0.6.7-Signed
          path: android-output/
      - name: Publish the one-time immutable signed APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-v0.6.7 >/dev/null 2>&1; then
            echo "::error::android-v0.6.7 already exists. Refusing to overwrite a cryptographically signed public release."
            exit 1
          fi
          gh release create android-v0.6.7 \
            android-output/KeyboardHeroes-Android-v0.6.7.apk \
            android-output/SHA256SUMS.txt \
            --title 'Keyboard Heroes Android v0.6.7 — Permanently Signed APK' \
            --notes-file android/SIGNED_RELEASE_NOTES.md --target main
