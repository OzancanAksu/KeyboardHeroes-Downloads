name: Android Debug QA Artifact (no public beta release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build developer-only debug package
        run: gradle --no-daemon --project-dir android :app:assembleDebug
      - name: Validate debug artifact without publishing
        shell: bash
        run: |
          set -euo pipefail
          file="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$file"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 26 "$file"
      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardHeroes-Android-v1.0.1-Debug-QA-ONLY
          path: android/app/build/outputs/apk/debug/app-debug.apk
